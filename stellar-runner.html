<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STELLAR RUNNER — A Sci-Fi Platformer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
  }

  #gameWrapper {
    position: relative;
    border: 2px solid #0ff3;
    box-shadow: 0 0 40px #0ff2, 0 0 80px #0ff1, inset 0 0 40px #0001;
  }

  canvas {
    display: block;
    image-rendering: pixelated;
  }

  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    pointer-events: none;
    z-index: 10;
  }

  .hud-item {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #0ff5;
    letter-spacing: 2px;
  }

  .hud-item span {
    color: #fff;
    font-weight: 700;
  }

  .hud-lives {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .hud-lives .life {
    width: 12px; height: 12px;
    background: #0f0;
    border-radius: 50%;
    box-shadow: 0 0 6px #0f0, 0 0 12px #0f05;
  }

  .hud-lives .life.lost {
    background: #333;
    box-shadow: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000c;
    z-index: 20;
    backdrop-filter: blur(4px);
  }

  #overlay.hidden { display: none; }

  #overlay h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    font-weight: 900;
    color: #0ff;
    text-shadow: 0 0 20px #0ff, 0 0 60px #0ff5, 0 0 100px #0ff3;
    letter-spacing: 8px;
    margin-bottom: 8px;
  }

  #overlay h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: #f0f;
    text-shadow: 0 0 10px #f0f;
    letter-spacing: 6px;
    margin-bottom: 40px;
  }

  #overlay .info {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  #overlay .prompt {
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    color: #fff;
    letter-spacing: 4px;
    animation: pulse 1.5s ease-in-out infinite;
    margin-top: 20px;
  }

  #overlay .level-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    color: #0f0;
    text-shadow: 0 0 20px #0f0;
    letter-spacing: 6px;
  }

  #overlay .score-final {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    color: #ff0;
    text-shadow: 0 0 15px #ff0;
    letter-spacing: 4px;
    margin-top: 12px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  .scanline {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      #0001 2px,
      #0001 4px
    );
  }
</style>

<body>

<div id="gameWrapper">

<script>
// ─── CANVAS SETUP ─────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 960, H = 540;
canvas.width = W; canvas.height = H;
document.getElementById('gameWrapper').style.width = W + 'px';

// ─── SOUND EFFECTS (Web Audio API) ───────────────────
const SFX = (() => {
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playTone(freq, duration, type = 'square', vol = 0.15, freqEnd = null, delay = 0) {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    if (freqEnd !== null) osc.frequency.linearRampToValueAtTime(freqEnd, ctx.currentTime + delay + duration);
    gain.gain.setValueAtTime(vol, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + delay + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration);
  }
  function noise(duration, vol = 0.08) {
    const ctx = getCtx();
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + duration);
    const filter = ctx.createBiquadFilter();
    filter.type = 'highpass';
    filter.frequency.value = 2000;
    source.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);
    source.start();
    source.stop(ctx.currentTime + duration);
  }
  return {
    jump() { playTone(300, 0.1, 'square', 0.12, 600); },
    doubleJump() { playTone(500, 0.08, 'square', 0.1, 900); playTone(700, 0.06, 'sine', 0.08, 1100, 0.04); },
    dash() { noise(0.12, 0.1); playTone(200, 0.08, 'sawtooth', 0.06, 80); },
    orbPickup() { playTone(800, 0.06, 'sine', 0.12, 1200); playTone(1200, 0.08, 'sine', 0.1, 1600, 0.06); },
    stomp() { playTone(120, 0.12, 'square', 0.15, 40); },
    hit() { playTone(80, 0.15, 'sawtooth', 0.15, 40); noise(0.1, 0.12); },
    checkpoint() {
      playTone(400, 0.08, 'sine', 0.1, 400);
      playTone(500, 0.08, 'sine', 0.1, 500, 0.08);
      playTone(600, 0.08, 'sine', 0.1, 600, 0.16);
      playTone(800, 0.12, 'sine', 0.12, 800, 0.24);
    },
    portal() { playTone(300, 0.3, 'sine', 0.1, 1200); playTone(400, 0.3, 'sine', 0.08, 1400, 0.05); },
    wallJump() { playTone(250, 0.05, 'square', 0.1, 400); },
    shield() { playTone(600, 0.1, 'sine', 0.1, 800); playTone(800, 0.1, 'sine', 0.08, 1000, 0.05); },
    shieldBreak() { playTone(500, 0.15, 'sawtooth', 0.12, 100); noise(0.08, 0.1); },
    shoot() { playTone(200, 0.08, 'sawtooth', 0.06, 100); },
  };
})();

// ─── GAME STATE ───────────────────────────────────────
const STATE = { TITLE: 0, PLAYING: 1, LEVEL_COMPLETE: 2, GAME_OVER: 3, WIN: 4, PAUSED: 5 };
let state = STATE.TITLE;
let previousState = STATE.PLAYING;
let score = 0, lives = 3, orbsCollected = 0, currentLevel = 0;
let camera = { x: 0, y: 0, renderX: 0, renderY: 0, lookAheadSmooth: 0 };
let frameCount = 0;
let stateTimer = 0;
let screenShake = 0;
let lastTime = 0;

// ─── COMBO SYSTEM ────────────────────────────────────
let comboMultiplier = 1;
let comboTimer = 0;
const COMBO_WINDOW = 120; // 2 seconds at 60fps
const MAX_COMBO = 5;

function addCombo() {
  comboTimer = COMBO_WINDOW;
  if (comboMultiplier < MAX_COMBO) comboMultiplier++;
}

function updateCombo() {
  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer <= 0) {
      comboMultiplier = 1;
    }
  }
}

// ─── SCORE POPUPS ────────────────────────────────────
let scorePopups = [];

function spawnScorePopup(x, y, value, color) {
  scorePopups.push({
    x, y, text: '+' + value,
    color, life: 60, maxLife: 60,
    vy: -1.5
  });
}

function updateScorePopups() {
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const p = scorePopups[i];
    p.y += p.vy;
    p.vy *= 0.98;
    p.life--;
    if (p.life <= 0) scorePopups.splice(i, 1);
  }
}

function drawScorePopups() {
  for (const p of scorePopups) {
    const alpha = p.life / p.maxLife;
    const scale = 1 + (1 - alpha) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.round(14 * scale)}px 'Orbitron', sans-serif`;
    ctx.fillStyle = p.color;
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x - camera.renderX, p.y - camera.renderY);
    ctx.textAlign = 'left';
  }
  ctx.globalAlpha = 1;
}

// ─── INPUT ────────────────────────────────────────────
const keys = {};
const justPressed = {};
window.addEventListener('keydown', e => {
  if (!keys[e.code]) justPressed[e.code] = true;
  keys[e.code] = true;
  if (e.code === 'Enter' || e.code === 'Space') {
    if (state === STATE.TITLE) startGame();
    else if (state === STATE.LEVEL_COMPLETE) nextLevel();
    else if (state === STATE.GAME_OVER || state === STATE.WIN) resetGame();
  }
  if (e.code === 'Escape') {
    if (state === STATE.PLAYING) {
      previousState = STATE.PLAYING;
      state = STATE.PAUSED;
      showOverlay();
    } else if (state === STATE.PAUSED) {
      state = previousState;
      document.getElementById('overlay').classList.add('hidden');
    }
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.code] = false);

// ─── STARS (PARALLAX) ─────────────────────────────────
const starLayers = [[], [], []];
for (let l = 0; l < 3; l++) {
  const count = [120, 60, 25][l];
  for (let i = 0; i < count; i++) {
    starLayers[l].push({
      x: Math.random() * W * 4,
      y: Math.random() * H,
      size: [1, 1.5, 2.5][l],
      brightness: Math.random() * 0.5 + 0.5,
      twinkleSpeed: Math.random() * 0.03 + 0.01
    });
  }
}

// ─── PARTICLES ────────────────────────────────────────
let particles = [];

function spawnParticles(x, y, color, count, speed = 3, life = 40) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const v = Math.random() * speed + 0.5;
    particles.push({
      x, y,
      vx: Math.cos(angle) * v,
      vy: Math.sin(angle) * v - 1,
      life,
      maxLife: life,
      color,
      size: Math.random() * 3 + 1
    });
  }
}

function spawnRingBurst(x, y, color, count, radius) {
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2;
    const v = 2.5;
    particles.push({
      x: x + Math.cos(angle) * radius,
      y: y + Math.sin(angle) * radius,
      vx: Math.cos(angle) * v,
      vy: Math.sin(angle) * v,
      life: 20,
      maxLife: 20,
      color,
      size: 2
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.05;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const alpha = p.life / p.maxLife;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - camera.renderX, p.y - camera.renderY, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}

// ─── SPEED LINES ──────────────────────────────────────
let speedLines = [];

function spawnSpeedLines() {
  for (let i = 0; i < 3; i++) {
    speedLines.push({
      x: W + Math.random() * 100,
      y: Math.random() * H,
      length: 30 + Math.random() * 60,
      speed: 15 + Math.random() * 10,
      life: 15,
      maxLife: 15
    });
  }
}

function updateSpeedLines() {
  for (let i = speedLines.length - 1; i >= 0; i--) {
    const l = speedLines[i];
    l.x -= l.speed * (player ? player.facing : 1);
    l.life--;
    if (l.life <= 0) speedLines.splice(i, 1);
  }
}

function drawSpeedLines() {
  for (const l of speedLines) {
    const alpha = (l.life / l.maxLife) * 0.3;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(l.x, l.y);
    ctx.lineTo(l.x + l.length, l.y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// ─── PROJECTILES (for shooter enemies) ───────────────
let projectiles = [];

function spawnProjectile(x, y, dir) {
  projectiles.push({ x, y, w: 8, h: 4, vx: dir * 2.1, life: 300 });
}

function updateProjectiles() {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx;
    p.life--;
    if (p.life <= 0 || p.x < camera.x - 50 || p.x > camera.x + W + 50) {
      projectiles.splice(i, 1);
      continue;
    }
    // Hit player
    if (player && player.invincible <= 0 && !player.dashing && rectCollide(player, p)) {
      projectiles.splice(i, 1);
      playerHit();
    }
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    const x = Math.round(p.x - camera.renderX);
    const y = Math.round(p.y - camera.renderY);
    ctx.fillStyle = '#f44';
    ctx.fillRect(x, y, p.w, p.h);
    ctx.fillStyle = '#f88';
    ctx.fillRect(x + 1, y + 1, p.w - 2, p.h - 2);
    // Glow
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = '#f00';
    ctx.fillRect(x - 2, y - 2, p.w + 4, p.h + 4);
    ctx.globalAlpha = 1;
  }
}

// ─── GAME OBJECTS ─────────────────────────────────────
let player, platforms, orbs, enemies, portal;
let lasers = [], shields = [], checkpoints = [];
let lastCheckpoint = null;

function createPlayer(x, y) {
  return {
    x, y, w: 24, h: 32,
    vx: 0, vy: 0,
    grounded: false,
    jumping: false,
    facing: 1,
    walkFrame: 0,
    walkTimer: 0,
    invincible: 0,
    jetpackParticleTimer: 0,
    // Coyote time & jump buffer
    coyoteTimer: 0,
    jumpBufferTimer: 0,
    // Double jump
    hasDoubleJump: true,
    spinAngle: 0,
    spinning: false,
    // Dash
    dashing: false,
    dashTimer: 0,
    dashCooldown: 0,
    dashDir: 1,
    // Wall slide & wall jump
    wallSliding: false,
    wallDir: 0,
    // Shield
    hasShield: false,
    shieldAngle: 0,
    // Landing impact
    landingSquash: 0,
    prevVy: 0,
    // Afterimages for dash
    afterimages: [],
  };
}

function loadLevel(idx) {
  const lvl = LEVELS[idx];
  player = createPlayer(60, H - 100);
  particles = [];
  projectiles = [];
  scorePopups = [];
  speedLines = [];
  camera.x = 0;
  camera.y = 0;
  camera.renderX = 0;
  camera.renderY = 0;
  camera.lookAheadSmooth = 0;
  comboMultiplier = 1;
  comboTimer = 0;
  lastCheckpoint = null;

  // Scale platform heights to match reduced jump physics
  const GROUND_Y = H - 32;
  const HEIGHT_SCALE = 0.7;
  platforms = lvl.platforms.map(p => {
    let y = p.y;
    // Only scale floating/neon/moving platforms (not ground-level metal)
    if (p.y < GROUND_Y) {
      const heightAboveGround = GROUND_Y - p.y;
      y = GROUND_Y - Math.round(heightAboveGround * HEIGHT_SCALE);
    }
    return { ...p, y, origX: p.x, origY: y, timer: Math.random() * Math.PI * 2 };
  });

  // Also scale orb positions to match lowered platforms
  orbs = lvl.orbs.map(o => {
    let y = o.y;
    if (o.y < GROUND_Y) {
      const heightAboveGround = GROUND_Y - o.y;
      y = GROUND_Y - Math.round(heightAboveGround * HEIGHT_SCALE);
    }
    return { ...o, y, collected: false, bobTimer: Math.random() * Math.PI * 2 };
  });

  enemies = lvl.enemies.map(e => {
    let y = e.y;
    if (e.y < GROUND_Y) {
      const heightAboveGround = GROUND_Y - e.y;
      y = GROUND_Y - Math.round(heightAboveGround * HEIGHT_SCALE);
    }
    return {
      ...e, y, origX: e.x, origY: y,
      alive: true, dir: 1, timer: Math.random() * Math.PI * 2,
      w: e.type === 'crawler' ? 28 : (e.type === 'shooter' ? 28 : 24),
      h: e.type === 'crawler' ? 24 : (e.type === 'shooter' ? 28 : 24),
      squishTimer: 0, shootTimer: 0,
    };
  });

  lasers = (lvl.lasers || []).map(l => {
    let y = l.y;
    if (l.y < GROUND_Y) {
      const heightAboveGround = GROUND_Y - l.y;
      y = GROUND_Y - Math.round(heightAboveGround * HEIGHT_SCALE);
    }
    return { ...l, y, timer: 0, active: true, warningTimer: 0 };
  });

  shields = (lvl.shields || []).map(s => {
    let y = s.y;
    if (s.y < GROUND_Y) {
      const heightAboveGround = GROUND_Y - s.y;
      y = GROUND_Y - Math.round(heightAboveGround * HEIGHT_SCALE);
    }
    return { ...s, y, collected: false, bobTimer: Math.random() * Math.PI * 2 };
  });

  checkpoints = (lvl.checkpoints || []).map(c => ({
    ...c, activated: false, flagY: 0, glowTimer: 0
  }));

  portal = { ...lvl.portal, timer: 0 };
}

// ─── DRAWING HELPERS ──────────────────────────────────

function drawPixelRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x - camera.renderX, y - camera.renderY, w, h);
}

function drawStars() {
  const speeds = [0.05, 0.15, 0.3];
  for (let l = 0; l < 3; l++) {
    for (const s of starLayers[l]) {
      const sx = ((s.x - camera.x * speeds[l]) % (W * 4) + W * 4) % (W * 4);
      if (sx > W + 4) continue;
      const twinkle = Math.sin(frameCount * s.twinkleSpeed) * 0.3 + 0.7;
      ctx.globalAlpha = s.brightness * twinkle;
      ctx.fillStyle = l === 2 ? '#aaf' : '#fff';
      ctx.fillRect(sx, s.y, s.size, s.size);
    }
  }
  ctx.globalAlpha = 1;
}

function drawNebula() {
  const lvl = LEVELS[currentLevel];
  const grd = ctx.createRadialGradient(
    W / 2 - camera.x * 0.05, H * 0.3, 50,
    W / 2 - camera.x * 0.05, H * 0.3, 400
  );
  grd.addColorStop(0, lvl.nebula + '40');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  const grd2 = ctx.createRadialGradient(
    W * 0.8 - camera.x * 0.08, H * 0.5, 30,
    W * 0.8 - camera.x * 0.08, H * 0.5, 300
  );
  grd2.addColorStop(0, '#0f055020');
  grd2.addColorStop(1, 'transparent');
  ctx.fillStyle = grd2;
  ctx.fillRect(0, 0, W, H);
}

function drawPlatform(p) {
  const x = Math.round(p.x - camera.renderX);
  const y = Math.round(p.y - camera.renderY);

  if (p.type === 'metal' || p.type === 'moving') {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(x, y, p.w, p.h);

    ctx.fillStyle = p.type === 'moving' ? '#f0f' : '#334';
    ctx.fillRect(x, y, p.w, 2);

    ctx.fillStyle = '#0003';
    for (let i = 32; i < p.w; i += 32) {
      ctx.fillRect(x + i, y, 1, p.h);
    }

    ctx.fillStyle = '#445';
    for (let i = 8; i < p.w; i += 32) {
      ctx.fillRect(x + i, y + 4, 2, 2);
      if (p.h > 20) ctx.fillRect(x + i, y + p.h - 6, 2, 2);
    }

    if (p.type === 'moving') {
      ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.08) * 0.15;
      ctx.fillStyle = '#f0f';
      ctx.fillRect(x, y + p.h, p.w, 2);
      ctx.globalAlpha = 1;
    }
  } else if (p.type === 'neon') {
    const pulse = Math.sin(frameCount * 0.06 + p.origX * 0.01) * 0.2 + 0.8;

    ctx.fillStyle = '#111';
    ctx.fillRect(x, y, p.w, p.h);

    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#0ff';
    ctx.fillRect(x, y, p.w, 2);
    ctx.globalAlpha = pulse * 0.3;
    ctx.fillRect(x, y + p.h, p.w, 3);
    ctx.globalAlpha = pulse * 0.6;
    ctx.fillRect(x, y, 2, p.h);
    ctx.fillRect(x + p.w - 2, y, 2, p.h);
    ctx.globalAlpha = 1;
  }
}

function drawPlayer() {
  const p = player;
  if (p.invincible > 0 && Math.floor(p.invincible / 4) % 2 === 0) return;

  // Draw afterimages first
  for (let i = 0; i < p.afterimages.length; i++) {
    const ai = p.afterimages[i];
    const alpha = (ai.life / ai.maxLife) * 0.3;
    ctx.globalAlpha = alpha;
    drawPlayerSprite(ai.x - camera.renderX, ai.y - camera.renderY, ai.facing, '#0af');
    ctx.globalAlpha = 1;
  }

  const x = Math.round(p.x - camera.renderX);
  let y = Math.round(p.y - camera.renderY);

  // Landing squash effect
  let scaleX = 1, scaleY = 1;
  if (p.landingSquash > 0) {
    const t = p.landingSquash / 6;
    scaleX = 1 + t * 0.3;
    scaleY = 1 - t * 0.2;
  }

  ctx.save();

  // Spinning for double jump
  if (p.spinning) {
    const cx = x + p.w / 2;
    const cy = y + p.h / 2;
    ctx.translate(cx, cy);
    ctx.rotate(p.spinAngle);
    ctx.translate(-cx, -cy);
  }

  // Squash/stretch
  if (scaleX !== 1 || scaleY !== 1) {
    const cx = x + p.w / 2;
    const cy = y + p.h;
    ctx.translate(cx, cy);
    ctx.scale(scaleX, scaleY);
    ctx.translate(-cx, -cy);
  }

  drawPlayerSprite(x, y, p.facing);

  ctx.restore();

  // Shield visual
  if (p.hasShield) {
    p.shieldAngle += 0.03;
    drawShieldAura(p.x - camera.renderX + p.w / 2, p.y - camera.renderY + p.h / 2, p.shieldAngle);
  }

  // Wall slide sparks visual
  if (p.wallSliding) {
    if (frameCount % 4 === 0) {
      const sparkX = p.wallDir === 1 ? p.x + p.w : p.x;
      spawnParticles(sparkX, p.y + p.h / 2, '#fa0', 2, 2, 10);
    }
  }
}

function drawPlayerSprite(x, y, facing, tintColor) {
  const f = facing;

  // Boots
  ctx.fillStyle = tintColor || '#445';
  ctx.fillRect(x + (f === 1 ? 4 : 2), y + 26, 8, 6);
  ctx.fillRect(x + (f === 1 ? 14 : 12), y + 26, 8, 6);

  // Legs
  ctx.fillStyle = tintColor || '#2244aa';
  ctx.fillRect(x + 6, y + 18, 5, 10);
  ctx.fillRect(x + 13, y + 18, 5, 10);

  // Body / suit
  ctx.fillStyle = tintColor || '#3366cc';
  ctx.fillRect(x + 4, y + 8, 16, 12);

  // Chest panel
  if (!tintColor) {
    ctx.fillStyle = '#0ff';
    ctx.globalAlpha = 0.6 + Math.sin(frameCount * 0.1) * 0.2;
    ctx.fillRect(x + 8, y + 10, 8, 4);
    ctx.globalAlpha = 1;
  }

  // Arms
  ctx.fillStyle = tintColor || '#2244aa';
  const armSwing = player && player.grounded ? Math.sin((player.walkFrame || 0) * 0.3) * 3 : -2;
  ctx.fillRect(x + 1, y + 9 + armSwing, 4, 10);
  ctx.fillRect(x + 19, y + 9 - armSwing, 4, 10);

  // Helmet
  ctx.fillStyle = tintColor || '#ddd';
  ctx.fillRect(x + 5, y, 14, 10);
  // Visor
  if (!tintColor) {
    ctx.fillStyle = '#0af';
    ctx.globalAlpha = 0.8;
    if (f === 1) {
      ctx.fillRect(x + 12, y + 2, 6, 5);
    } else {
      ctx.fillRect(x + 6, y + 2, 6, 5);
    }
    ctx.globalAlpha = 1;
    // Visor glint
    ctx.fillStyle = '#fff';
    if (f === 1) {
      ctx.fillRect(x + 16, y + 2, 1, 2);
    } else {
      ctx.fillRect(x + 7, y + 2, 1, 2);
    }
  }

  // Jetpack
  ctx.fillStyle = tintColor || '#556';
  const jpx = f === 1 ? x + 1 : x + 19;
  ctx.fillRect(jpx, y + 6, 4, 10);
  if (!tintColor && player && !player.grounded && player.vy < 0) {
    ctx.fillStyle = '#f80';
    ctx.globalAlpha = 0.6 + Math.random() * 0.4;
    ctx.fillRect(jpx, y + 16, 4, 4 + Math.random() * 4);
    ctx.fillStyle = '#ff0';
    ctx.fillRect(jpx + 1, y + 16, 2, 3 + Math.random() * 3);
    ctx.globalAlpha = 1;
  }
}

function drawShieldAura(cx, cy, angle) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  const sides = 6;
  const radius = 22;
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.5 + Math.sin(frameCount * 0.1) * 0.2;
  ctx.beginPath();
  for (let i = 0; i <= sides; i++) {
    const a = (i / sides) * Math.PI * 2;
    const px = Math.cos(a) * radius;
    const py = Math.sin(a) * radius;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
  // Inner glow
  ctx.globalAlpha = 0.1;
  ctx.fillStyle = '#0f0';
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOrb(o) {
  if (o.collected) return;
  const bob = Math.sin(o.bobTimer) * 4;
  const x = Math.round(o.x - camera.renderX);
  const y = Math.round(o.y + bob - camera.renderY);
  const pulse = Math.sin(frameCount * 0.08 + o.bobTimer) * 0.3 + 0.7;

  ctx.globalAlpha = pulse * 0.15;
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.arc(x + 8, y + 8, 16, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0a0';
  ctx.fillRect(x + 4, y + 2, 8, 12);
  ctx.fillRect(x + 2, y + 4, 12, 8);

  ctx.fillStyle = '#0f0';
  ctx.fillRect(x + 5, y + 4, 6, 8);
  ctx.fillRect(x + 4, y + 5, 8, 6);

  ctx.fillStyle = '#bfb';
  ctx.fillRect(x + 5, y + 4, 2, 2);

  ctx.globalAlpha = 1;
}

function drawEnemy(e) {
  if (!e.alive) return;
  const x = Math.round(e.x - camera.renderX);
  const y = Math.round(e.y - camera.renderY);

  if (e.type === 'crawler') {
    const squish = e.squishTimer > 0 ? 0.6 : 1;
    const ew = Math.round(e.w / squish);
    const eh = Math.round(e.h * squish);
    const oy = e.h - eh;

    ctx.fillStyle = '#a030a0';
    ctx.fillRect(x - (ew - e.w) / 2, y + oy + 4, ew, eh - 4);

    ctx.fillStyle = '#c050c0';
    ctx.fillRect(x + 4 - (ew - e.w) / 2, y + oy, ew - 8, 8);

    ctx.fillStyle = '#f0f';
    const eyeY = y + oy + 6;
    ctx.fillRect(x + 4, eyeY, 4, 4);
    ctx.fillRect(x + 18, eyeY, 4, 4);

    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 5 + (e.dir > 0 ? 1 : 0), eyeY + 1, 2, 2);
    ctx.fillRect(x + 19 + (e.dir > 0 ? 1 : 0), eyeY + 1, 2, 2);

    ctx.fillStyle = '#803080';
    const legAnim = Math.sin(frameCount * 0.15) * 2;
    ctx.fillRect(x + 2, y + oy + eh, 4, 4 + legAnim);
    ctx.fillRect(x + 10, y + oy + eh, 4, 4 - legAnim);
    ctx.fillRect(x + 20, y + oy + eh, 4, 4 + legAnim);
  } else if (e.type === 'floater') {
    const bob = Math.sin(e.timer) * 6;
    const fy = y + bob;

    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(x + 12, fy + 12, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.fillStyle = '#cc2020';
    ctx.fillRect(x + 4, fy + 4, 16, 16);
    ctx.fillRect(x + 2, fy + 6, 20, 12);

    ctx.fillStyle = '#ff4444';
    ctx.fillRect(x + 8, fy + 8, 8, 8);
    ctx.fillStyle = '#fff';
    const eyeShift = Math.sin(frameCount * 0.05) * 2;
    ctx.fillRect(x + 10 + eyeShift, fy + 10, 4, 4);
    ctx.fillStyle = '#f00';
    ctx.fillRect(x + 11 + eyeShift, fy + 11, 2, 2);

    ctx.fillStyle = '#ff3333';
    ctx.fillRect(x, fy + 10, 3, 4);
    ctx.fillRect(x + 21, fy + 10, 3, 4);
    ctx.fillRect(x + 10, fy, 4, 4);
    ctx.fillRect(x + 10, fy + 20, 4, 4);
  } else if (e.type === 'shooter') {
    // Shooter: turret-like enemy
    // Base
    ctx.fillStyle = '#2a2a40';
    ctx.fillRect(x + 2, y + 16, 24, 12);
    // Body
    ctx.fillStyle = '#4040aa';
    ctx.fillRect(x + 4, y + 4, 20, 16);
    // Cannon
    const cannonDir = player ? (player.x > e.x ? 1 : -1) : e.dir;
    ctx.fillStyle = '#6060cc';
    if (cannonDir === 1) {
      ctx.fillRect(x + 20, y + 8, 10, 6);
    } else {
      ctx.fillRect(x - 2, y + 8, 10, 6);
    }
    // Eye/sensor
    ctx.fillStyle = '#f44';
    const blink = Math.sin(frameCount * 0.1) > 0.8 ? 0 : 1;
    ctx.fillRect(x + 10, y + 8, 8, 4 * blink);
    // Warning glow when about to shoot
    if (e.shootTimer > 75) {
      ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.3) * 0.2;
      ctx.fillStyle = '#f00';
      ctx.fillRect(x + 4, y + 4, 20, 16);
      ctx.globalAlpha = 1;
    }
  }
}

function drawPortal() {
  const p = portal;
  const x = Math.round(p.x - camera.renderX);
  const y = Math.round(p.y - camera.renderY);
  p.timer += 0.05;

  for (let i = 3; i >= 0; i--) {
    ctx.globalAlpha = 0.08 * (4 - i);
    ctx.fillStyle = '#0ff';
    const s = 40 + i * 12;
    ctx.beginPath();
    ctx.arc(x + 20, y + 32, s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#223';
  ctx.fillRect(x, y, 40, 64);
  ctx.fillStyle = '#334';
  ctx.fillRect(x + 2, y + 2, 36, 60);

  for (let row = 0; row < 60; row += 4) {
    for (let col = 0; col < 36; col += 4) {
      const dist = Math.sqrt((col - 18) ** 2 + (row - 30) ** 2);
      const angle = Math.atan2(row - 30, col - 18) + p.timer;
      const wave = Math.sin(dist * 0.15 - p.timer * 2 + angle) * 0.5 + 0.5;
      const r = Math.round(wave * 50);
      const g = Math.round(200 + wave * 55);
      const b = 255;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.globalAlpha = 0.7 + wave * 0.3;
      ctx.fillRect(x + 2 + col, y + 2 + row, 4, 4);
    }
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#0ff';
  ctx.fillRect(x, y, 40, 2);
  ctx.fillRect(x, y + 62, 40, 2);
  ctx.fillRect(x, y, 2, 64);
  ctx.fillRect(x + 38, y, 2, 64);
}

function drawLaser(l) {
  const x = Math.round(l.x - camera.renderX);
  const y = Math.round(l.y - camera.renderY);

  if (l.active) {
    // Warning flicker before turning off
    const aboutToOff = l.timer > l.onTime - 15;
    const flicker = aboutToOff ? (Math.sin(frameCount * 0.5) > 0 ? 1 : 0.3) : 1;
    // Main beam
    ctx.globalAlpha = 0.9 * flicker;
    ctx.fillStyle = '#f44';
    ctx.fillRect(x, y, l.w, l.h);
    // Inner bright
    ctx.fillStyle = '#faa';
    ctx.fillRect(x, y + 1, l.w, l.h - 2);
    // Core
    ctx.fillStyle = '#fff';
    ctx.fillRect(x, y + 2, l.w, Math.max(l.h - 4, 1));
    // Glow
    ctx.globalAlpha = 0.15 * flicker;
    ctx.fillStyle = '#f00';
    ctx.fillRect(x - 4, y - 8, l.w + 8, l.h + 16);
    ctx.globalAlpha = 1;
  } else {
    // Warning flicker before turning on
    const aboutToOn = l.timer > l.offTime - 20;
    if (aboutToOn) {
      const flicker = Math.sin(frameCount * 0.4) > 0 ? 0.3 : 0;
      ctx.globalAlpha = flicker;
      ctx.fillStyle = '#f44';
      ctx.fillRect(x, y, l.w, l.h);
      ctx.globalAlpha = 1;
    }
    // Emitter dots at ends
    ctx.fillStyle = '#400';
    ctx.fillRect(x, y + 1, 3, l.h - 2);
    ctx.fillRect(x + l.w - 3, y + 1, 3, l.h - 2);
  }
}

function drawShieldPickup(s) {
  if (s.collected) return;
  const bob = Math.sin(s.bobTimer) * 3;
  const x = Math.round(s.x - camera.renderX);
  const y = Math.round(s.y + bob - camera.renderY);

  // Glow
  ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.arc(x + 8, y + 8, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  // Hexagon shape
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 - Math.PI / 2;
    const px = x + 8 + Math.cos(a) * 8;
    const py = y + 8 + Math.sin(a) * 8;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.fillStyle = '#0f04';
  ctx.fill();

  // Inner S
  ctx.fillStyle = '#0f0';
  ctx.font = 'bold 10px Orbitron, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('S', x + 8, y + 12);
  ctx.textAlign = 'left';
}

function drawCheckpoint(c) {
  const x = Math.round(c.x - camera.renderX);
  const y = Math.round(c.y - camera.renderY);
  const flagHeight = 64;

  // Pole
  ctx.fillStyle = c.activated ? '#aaa' : '#555';
  ctx.fillRect(x + 6, y - flagHeight, 3, flagHeight);

  // Flag
  if (c.activated) {
    const wave = Math.sin(frameCount * 0.08) * 2;
    ctx.fillStyle = '#0f0';
    ctx.globalAlpha = 0.8 + Math.sin(frameCount * 0.1) * 0.2;
    // Flag triangle
    ctx.beginPath();
    ctx.moveTo(x + 9, y - flagHeight);
    ctx.lineTo(x + 30 + wave, y - flagHeight + 10);
    ctx.lineTo(x + 9, y - flagHeight + 20);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
    // Glow at top
    ctx.fillStyle = '#0f0';
    ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.06) * 0.15;
    ctx.beginPath();
    ctx.arc(x + 7, y - flagHeight, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  } else {
    // Lowered flag
    ctx.fillStyle = '#666';
    ctx.beginPath();
    ctx.moveTo(x + 9, y - 20);
    ctx.lineTo(x + 25, y - 14);
    ctx.lineTo(x + 9, y - 8);
    ctx.closePath();
    ctx.fill();
  }

  // Base
  ctx.fillStyle = c.activated ? '#0a0' : '#333';
  ctx.fillRect(x, y - 4, 16, 4);
}

// ─── PHYSICS / UPDATE ─────────────────────────────────
const GRAVITY = 0.196;
const JUMP_FORCE = -7.0;
const MOVE_SPEED = 1.96;
const FRICTION = 0.88;
const ACCEL = 0.49;
const COYOTE_FRAMES = 8;
const JUMP_BUFFER_FRAMES = 10;
const DASH_DURATION = 8;
const DASH_COOLDOWN = 45;
const DASH_SPEED = 8.4;
const WALL_SLIDE_SPEED = 1.05;
const WALL_JUMP_FORCE_X = 4.2;
const WALL_JUMP_FORCE_Y = -6.3;

function rectCollide(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function updatePlatforms() {
  for (const p of platforms) {
    if (p.type === 'moving') {
      p.timer += 0.0084 * p.speed;
      p.x = p.origX + Math.sin(p.timer) * p.moveX;
    }
  }
}

function checkWallCollision(dir) {
  // Check if player is touching a wall on the given side
  const testRect = {
    x: dir === 1 ? player.x + player.w : player.x - 2,
    y: player.y + 4,
    w: 2,
    h: player.h - 8
  };
  for (const pl of platforms) {
    if (rectCollide(testRect, pl)) return true;
  }
  return false;
}

function updatePlayer() {
  const p = player;
  const wantLeft = keys['ArrowLeft'] || keys['KeyA'];
  const wantRight = keys['ArrowRight'] || keys['KeyD'];
  const wantJump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
  const wantDash = justPressed['ShiftLeft'] || justPressed['ShiftRight'];

  // Store previous vy for landing detection
  p.prevVy = p.vy;

  // ─── DASH ───
  if (wantDash && p.dashCooldown <= 0 && !p.dashing) {
    p.dashing = true;
    p.dashTimer = DASH_DURATION;
    p.dashCooldown = DASH_COOLDOWN;
    p.dashDir = p.facing;
    p.vy = 0;
    SFX.dash();
  }

  if (p.dashing) {
    p.dashTimer--;
    p.vx = DASH_SPEED * p.dashDir;
    p.vy = 0;
    // Afterimages
    if (p.dashTimer % 2 === 0) {
      p.afterimages.push({ x: p.x, y: p.y, facing: p.facing, life: 8, maxLife: 8 });
    }
    // Speed lines
    if (p.dashTimer % 2 === 0) spawnSpeedLines();
    if (p.dashTimer <= 0) {
      p.dashing = false;
      p.vx = MOVE_SPEED * p.dashDir;
    }
  } else {
    // Horizontal movement
    if (wantLeft) {
      p.vx -= ACCEL;
      p.facing = -1;
    }
    if (wantRight) {
      p.vx += ACCEL;
      p.facing = 1;
    }

    p.vx *= FRICTION;
    if (Math.abs(p.vx) > MOVE_SPEED) p.vx = MOVE_SPEED * Math.sign(p.vx);
    if (Math.abs(p.vx) < 0.1) p.vx = 0;
  }

  if (p.dashCooldown > 0) p.dashCooldown--;

  // Update afterimages
  for (let i = p.afterimages.length - 1; i >= 0; i--) {
    p.afterimages[i].life--;
    if (p.afterimages[i].life <= 0) p.afterimages.splice(i, 1);
  }

  // ─── JUMP BUFFERING ───
  if (justPressed['Space'] || justPressed['ArrowUp'] || justPressed['KeyW']) {
    p.jumpBufferTimer = JUMP_BUFFER_FRAMES;
  }
  if (p.jumpBufferTimer > 0) p.jumpBufferTimer--;

  // ─── COYOTE TIME ───
  if (p.grounded) {
    p.coyoteTimer = COYOTE_FRAMES;
  } else {
    if (p.coyoteTimer > 0) p.coyoteTimer--;
  }

  // ─── WALL SLIDE ───
  p.wallSliding = false;
  p.wallDir = 0;
  if (!p.grounded && !p.dashing && p.vy > 0) {
    if (wantRight && checkWallCollision(1)) {
      p.wallSliding = true;
      p.wallDir = 1;
    } else if (wantLeft && checkWallCollision(-1)) {
      p.wallSliding = true;
      p.wallDir = -1;
    }
  }

  if (p.wallSliding) {
    if (p.vy > WALL_SLIDE_SPEED) p.vy = WALL_SLIDE_SPEED;
    p.coyoteTimer = 0; // No coyote off walls, use wall jump instead
    p.hasDoubleJump = true; // Reset double jump when wall sliding
  }

  // ─── JUMP (with coyote time + buffer) ───
  const canGroundJump = p.coyoteTimer > 0 && !p.wallSliding;
  if (p.jumpBufferTimer > 0 && canGroundJump) {
    p.vy = JUMP_FORCE;
    p.grounded = false;
    p.jumping = true;
    p.coyoteTimer = 0;
    p.jumpBufferTimer = 0;
    p.hasDoubleJump = true;
    spawnParticles(p.x + p.w / 2, p.y + p.h, '#0af', 8, 2.5, 20);
    SFX.jump();
  }

  // ─── WALL JUMP ───
  if (p.wallSliding && p.jumpBufferTimer > 0) {
    p.vx = -p.wallDir * WALL_JUMP_FORCE_X;
    p.vy = WALL_JUMP_FORCE_Y;
    p.facing = -p.wallDir;
    p.wallSliding = false;
    p.jumping = true;
    p.jumpBufferTimer = 0;
    p.hasDoubleJump = true;
    spawnParticles(p.x + (p.wallDir === 1 ? p.w : 0), p.y + p.h / 2, '#fa0', 8, 3, 15);
    SFX.wallJump();
  }

  // ─── DOUBLE JUMP ───
  if (p.jumpBufferTimer > 0 && !p.grounded && p.coyoteTimer <= 0 && !p.wallSliding && p.hasDoubleJump) {
    p.vy = JUMP_FORCE * 0.85;
    p.hasDoubleJump = false;
    p.jumpBufferTimer = 0;
    p.spinning = true;
    p.spinAngle = 0;
    spawnRingBurst(p.x + p.w / 2, p.y + p.h / 2, '#0ff', 12, 8);
    SFX.doubleJump();
  }

  // Variable jump height
  if (p.jumping && !wantJump && p.vy < -4 && !p.dashing) {
    p.vy = -2.8;
  }

  // Spin animation
  if (p.spinning) {
    p.spinAngle += 0.5;
    if (p.spinAngle >= Math.PI * 2) {
      p.spinning = false;
      p.spinAngle = 0;
    }
  }

  // Gravity (skip during dash)
  if (!p.dashing) {
    p.vy += GRAVITY;
    if (p.vy > 8.4) p.vy = 8.4;
  }

  // Move X
  p.x += p.vx;

  // Collide X with platforms
  for (const pl of platforms) {
    if (rectCollide(p, pl)) {
      if (p.vx > 0) p.x = pl.x - p.w;
      else if (p.vx < 0) p.x = pl.x + pl.w;
      p.vx = 0;
    }
  }

  // Move Y
  p.y += p.vy;
  p.grounded = false;

  // Collide Y with platforms
  for (const pl of platforms) {
    if (rectCollide(p, pl)) {
      if (p.vy > 0) {
        // Landing impact
        if (p.prevVy > 5) {
          p.landingSquash = 6;
          spawnParticles(p.x + p.w / 2, pl.y, '#888', 6 + Math.floor(p.prevVy), 2, 15);
        }
        p.y = pl.y - p.h;
        p.vy = 0;
        p.grounded = true;
        p.jumping = false;
        p.hasDoubleJump = true;
        p.spinning = false;
        p.spinAngle = 0;

        // Ride moving platforms
        if (pl.type === 'moving') {
          const newX = pl.origX + Math.sin(pl.timer) * pl.moveX;
          const prevX = pl.origX + Math.sin(pl.timer - 0.0084 * pl.speed) * pl.moveX;
          p.x += newX - prevX;
        }
      } else if (p.vy < 0) {
        p.y = pl.y + pl.h;
        p.vy = 0;
      }
    }
  }

  // Landing squash timer
  if (p.landingSquash > 0) p.landingSquash--;

  // Walk animation
  if (p.grounded && Math.abs(p.vx) > 0.5) {
    p.walkTimer++;
    if (p.walkTimer > 5) {
      p.walkTimer = 0;
      p.walkFrame++;
    }
  } else {
    p.walkFrame = 0;
  }

  // Jetpack particles
  if (!p.grounded && p.vy < 0 && !p.dashing) {
    p.jetpackParticleTimer++;
    if (p.jetpackParticleTimer % 3 === 0) {
      const jpx = p.facing === 1 ? p.x + 3 : p.x + 21;
      spawnParticles(jpx, p.y + 18, '#f80', 1, 1.5, 15);
    }
  }

  // Invincibility timer
  if (p.invincible > 0) p.invincible--;

  // Level bounds
  if (p.x < 0) p.x = 0;
  if (p.x > LEVELS[currentLevel].width - p.w) p.x = LEVELS[currentLevel].width - p.w;

  // Fall death
  if (p.y > H + 50) {
    playerDie();
  }

  // ─── RUNNING DUST ───
  if (p.grounded && Math.abs(p.vx) > 1.5 && frameCount % 4 === 0) {
    const dustX = p.facing === -1 ? p.x + p.w : p.x;
    spawnParticles(dustX, p.y + p.h - 2, '#5568', 2, 1.2, 18);
  }

  // Speed lines when moving fast
  if (Math.abs(p.vx) > MOVE_SPEED * 0.8 && frameCount % 3 === 0) {
    spawnSpeedLines();
  }

  // ─── CAMERA (smooth with gradual look-ahead and vertical tracking) ───
  const targetLookAhead = p.facing * 80;
  camera.lookAheadSmooth += (targetLookAhead - camera.lookAheadSmooth) * 0.03;
  const targetCamX = p.x - W / 3 + camera.lookAheadSmooth;
  const targetCamY = Math.min(0, p.y - H / 2 + 50);
  camera.x += (targetCamX - camera.x) * 0.08;
  camera.y += (targetCamY - camera.y) * 0.04;
  if (camera.x < 0) camera.x = 0;
  if (camera.x > LEVELS[currentLevel].width - W) camera.x = LEVELS[currentLevel].width - W;
  if (camera.y > 0) camera.y = 0;
  // Snap render camera to whole pixels to prevent sub-pixel jitter
  camera.renderX = Math.round(camera.x);
  camera.renderY = Math.round(camera.y);
}

function updateOrbs() {
  for (const o of orbs) {
    if (o.collected) continue;
    o.bobTimer += 0.05;
    if (rectCollide(player, { x: o.x, y: o.y, w: 16, h: 16 })) {
      o.collected = true;
      addCombo();
      const points = 100 * comboMultiplier;
      score += points;
      orbsCollected++;
      spawnParticles(o.x + 8, o.y + 8, '#0f0', 12, 3, 30);
      spawnScorePopup(o.x + 8, o.y, points, '#0f0');
      screenShake = 4;
      SFX.orbPickup();
    }
  }
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue;

    if (e.squishTimer > 0) {
      e.squishTimer--;
      if (e.squishTimer <= 0) e.alive = false;
      continue;
    }

    if (e.type === 'crawler') {
      e.x += e.dir * 0.5;
      if (e.x > e.origX + e.range || e.x < e.origX - e.range) {
        e.dir *= -1;
      }
    } else if (e.type === 'floater') {
      e.timer += 0.0175;
      e.x = e.origX + Math.sin(e.timer * 0.7) * e.range;
    } else if (e.type === 'shooter') {
      e.shootTimer++;
      if (e.shootTimer >= 90) {
        e.shootTimer = 0;
        const dir = player.x > e.x ? 1 : -1;
        spawnProjectile(e.x + (dir === 1 ? e.w : -8), e.y + 8, dir);
        SFX.shoot();
      }
    }

    // Player collision (skip if dashing/invincible)
    if (player.invincible <= 0 && !player.dashing && rectCollide(player, e)) {
      // Stomp check
      if (player.vy > 0 && player.y + player.h - 8 < e.y + e.h / 2) {
        // Stomp!
        if (e.type === 'crawler' || e.type === 'shooter') {
          e.squishTimer = 15;
        } else {
          e.alive = false;
        }
        player.vy = JUMP_FORCE * 0.7;
        player.hasDoubleJump = true;
        addCombo();
        const basePoints = e.type === 'shooter' ? 300 : 200;
        const points = basePoints * comboMultiplier;
        score += points;
        screenShake = 6;
        spawnParticles(e.x + e.w / 2, e.y + e.h / 2, e.type === 'crawler' ? '#f0f' : (e.type === 'shooter' ? '#66f' : '#f44'), 15, 4, 25);
        spawnScorePopup(e.x + e.w / 2, e.y, points, '#f0f');
        SFX.stomp();
      } else {
        playerHit();
      }
    }
  }
}

function updateLasers() {
  for (const l of lasers) {
    l.timer++;
    if (l.active) {
      if (l.timer >= l.onTime) {
        l.timer = 0;
        l.active = false;
      }
      // Check collision with player
      if (player.invincible <= 0 && !player.dashing && rectCollide(player, l)) {
        playerHit();
      }
    } else {
      if (l.timer >= l.offTime) {
        l.timer = 0;
        l.active = true;
      }
    }
  }
}

function updateShields() {
  for (const s of shields) {
    if (s.collected) continue;
    s.bobTimer += 0.05;
    if (rectCollide(player, { x: s.x, y: s.y, w: 16, h: 16 })) {
      s.collected = true;
      player.hasShield = true;
      spawnParticles(s.x + 8, s.y + 8, '#0f0', 15, 3, 30);
      SFX.shield();
    }
  }
}

function updateCheckpoints() {
  for (const c of checkpoints) {
    if (c.activated) continue;
    if (rectCollide(player, { x: c.x, y: c.y - 64, w: 16, h: 64 })) {
      c.activated = true;
      lastCheckpoint = { x: c.x, y: c.y - 40 };
      spawnParticles(c.x + 8, c.y - 32, '#0f0', 20, 3, 30);
      SFX.checkpoint();
    }
  }
}

function checkPortal() {
  const p = portal;
  const portalRect = { x: p.x, y: p.y, w: 40, h: 64 };
  if (rectCollide(player, portalRect)) {
    spawnParticles(p.x + 20, p.y + 32, '#0ff', 30, 5, 40);
    screenShake = 10;
    const points = 500 * comboMultiplier;
    score += points;
    spawnScorePopup(p.x + 20, p.y, points, '#0ff');
    SFX.portal();
    if (currentLevel < LEVELS.length - 1) {
      state = STATE.LEVEL_COMPLETE;
      stateTimer = 120;
    } else {
      state = STATE.WIN;
      stateTimer = 0;
    }
    showOverlay();
  }
}

function playerHit() {
  // Shield absorbs hit
  if (player.hasShield) {
    player.hasShield = false;
    player.invincible = 60;
    screenShake = 6;
    spawnRingBurst(player.x + player.w / 2, player.y + player.h / 2, '#0f0', 16, 20);
    SFX.shieldBreak();
    return;
  }
  lives--;
  player.invincible = 90;
  player.vy = -4.2;
  screenShake = 10;
  spawnParticles(player.x + player.w / 2, player.y + player.h / 2, '#f00', 20, 4, 30);
  SFX.hit();
  comboMultiplier = 1;
  comboTimer = 0;
  if (lives <= 0) {
    state = STATE.GAME_OVER;
    stateTimer = 0;
    showOverlay();
  }
}

function playerDie() {
  lives--;
  screenShake = 8;
  spawnParticles(player.x + player.w / 2, player.y, '#f00', 20, 4, 30);
  SFX.hit();
  comboMultiplier = 1;
  comboTimer = 0;
  if (lives <= 0) {
    state = STATE.GAME_OVER;
    stateTimer = 0;
    showOverlay();
  } else {
    // Respawn at checkpoint or start
    if (lastCheckpoint) {
      player.x = lastCheckpoint.x;
      player.y = lastCheckpoint.y;
    } else {
      player.x = 60;
      player.y = H - 100;
    }
    player.vx = 0;
    player.vy = 0;
    player.invincible = 90;
    player.dashing = false;
    player.dashTimer = 0;
    player.hasDoubleJump = true;
    camera.x = Math.max(0, player.x - W / 3);
    camera.renderX = Math.round(camera.x);
    camera.lookAheadSmooth = 0;
  }
}

// ─── HUD (Canvas-drawn additions) ────────────────────
function drawCanvasHUD() {
  // Dash cooldown bar
  if (player) {
    const barX = 10;
    const barY = H - 20;
    const barW = 60;
    const barH = 6;
    const cooldownPct = player.dashCooldown > 0 ? 1 - (player.dashCooldown / DASH_COOLDOWN) : 1;

    ctx.fillStyle = '#222';
    ctx.fillRect(barX, barY, barW, barH);
    ctx.fillStyle = cooldownPct >= 1 ? '#0ff' : '#066';
    ctx.fillRect(barX, barY, barW * cooldownPct, barH);
    ctx.strokeStyle = '#0ff4';
    ctx.strokeRect(barX, barY, barW, barH);

    ctx.font = '8px Orbitron, sans-serif';
    ctx.fillStyle = '#0ff';
    ctx.fillText('DASH', barX, barY - 3);

    // Shield indicator
    if (player.hasShield) {
      ctx.fillStyle = '#0f0';
      ctx.font = '10px Orbitron, sans-serif';
      ctx.fillText('SHIELD', barX + barW + 10, barY + 6);
      // Small shield icon
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(barX + barW + 70, barY + 2, 5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Combo display
  if (comboMultiplier > 1) {
    const alpha = Math.min(1, comboTimer / 30);
    const scale = 1 + Math.sin(frameCount * 0.15) * 0.1;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${Math.round(28 * scale)}px Orbitron, sans-serif`;
    ctx.textAlign = 'center';
    // Rainbow-ish based on combo
    const colors = ['#fff', '#ff0', '#f80', '#f0f', '#0ff'];
    ctx.fillStyle = colors[Math.min(comboMultiplier - 1, colors.length - 1)];
    ctx.fillText(`x${comboMultiplier} COMBO`, W / 2, 70);
    // Shadow
    ctx.fillStyle = '#000';
    ctx.globalAlpha = alpha * 0.3;
    ctx.fillText(`x${comboMultiplier} COMBO`, W / 2 + 2, 72);
    ctx.textAlign = 'left';
    ctx.restore();
  }
}

// ─── UI ───────────────────────────────────────────────
function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = currentLevel + 1;
  document.getElementById('orbDisplay').textContent = orbsCollected;
  const livesEl = document.getElementById('livesDisplay');
  livesEl.innerHTML = '<span class="hud-item" style="margin-right:4px">LIVES</span>';
  for (let i = 0; i < 3; i++) {
    const div = document.createElement('div');
    div.className = 'life' + (i >= lives ? ' lost' : '');
    livesEl.appendChild(div);
  }
}

function showOverlay() {
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  if (state === STATE.PAUSED) {
    overlay.innerHTML = `
      <h1 style="font-size:36px">PAUSED</h1>
      <div class="info" style="margin-top:20px">ARROWS / WASD — Move</div>
      <div class="info">SPACE — Jump / Double Jump</div>
      <div class="info">SHIFT — Dash</div>
      <div class="info">Hold into wall — Wall Slide</div>
      <div class="info">Jump on wall — Wall Jump</div>
      <div class="prompt">PRESS ESC TO RESUME</div>
    `;
  } else if (state === STATE.LEVEL_COMPLETE) {
    overlay.innerHTML = `
      <div class="level-text">SECTOR CLEARED</div>
      <h2>${LEVELS[currentLevel].name}</h2>
      <div class="score-final">+500 BONUS</div>
      <div class="prompt">PRESS ENTER TO CONTINUE</div>
    `;
  } else if (state === STATE.GAME_OVER) {
    overlay.innerHTML = `
      <h1 style="color:#f44;text-shadow:0 0 20px #f00,0 0 60px #f005">MISSION FAILED</h1>
      <div class="score-final">FINAL SCORE: ${score}</div>
      <div class="info">ORBS COLLECTED: ${orbsCollected}</div>
      <div class="prompt">PRESS ENTER TO RETRY</div>
    `;
  } else if (state === STATE.WIN) {
    overlay.innerHTML = `
      <h1 style="color:#0f0;text-shadow:0 0 20px #0f0,0 0 60px #0f05">MISSION COMPLETE</h1>
      <h2>ALL SECTORS CLEARED</h2>
      <div class="score-final">FINAL SCORE: ${score}</div>
      <div class="info">ORBS COLLECTED: ${orbsCollected}</div>
      <div class="prompt">PRESS ENTER TO PLAY AGAIN</div>
    `;
  }
}

// ─── GAME FLOW ────────────────────────────────────────
function startGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3; orbsCollected = 0; currentLevel = 0;
  document.getElementById('overlay').classList.add('hidden');
  loadLevel(0);
}

function nextLevel() {
  currentLevel++;
  document.getElementById('overlay').classList.add('hidden');
  state = STATE.PLAYING;
  loadLevel(currentLevel);
}

function resetGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3; orbsCollected = 0; currentLevel = 0;
  document.getElementById('overlay').classList.add('hidden');
  loadLevel(0);
}

// ─── MAIN LOOP ────────────────────────────────────────
function gameLoop() {
  frameCount++;

  // Background
  ctx.fillStyle = LEVELS[currentLevel]?.bgColor || '#050510';
  ctx.fillRect(0, 0, W, H);

  drawStars();
  drawNebula();

  if (state === STATE.PLAYING) {
    updatePlatforms();
    updatePlayer();
    updateOrbs();
    updateEnemies();
    updateLasers();
    updateShields();
    updateCheckpoints();
    updateProjectiles();
    checkPortal();
    updateParticles();
    updateScorePopups();
    updateCombo();
    updateSpeedLines();

    // Screen shake
    if (screenShake > 0) {
      ctx.save();
      ctx.translate(
        (Math.random() - 0.5) * screenShake,
        (Math.random() - 0.5) * screenShake
      );
      screenShake *= 0.85;
      if (screenShake < 0.5) screenShake = 0;
    }

    // Draw world
    for (const p of platforms) drawPlatform(p);
    for (const l of lasers) drawLaser(l);
    for (const c of checkpoints) drawCheckpoint(c);
    for (const s of shields) drawShieldPickup(s);
    for (const o of orbs) drawOrb(o);
    for (const e of enemies) drawEnemy(e);
    drawProjectiles();
    drawPortal();
    drawPlayer();
    drawParticles();
    drawScorePopups();
    drawSpeedLines();

    if (screenShake > 0) ctx.restore();

    drawCanvasHUD();
    updateHUD();

  } else if (state === STATE.PAUSED) {
    // Still render world behind overlay (frozen)
    if (platforms) {
      for (const p of platforms) drawPlatform(p);
      for (const l of lasers) drawLaser(l);
      for (const c of checkpoints) drawCheckpoint(c);
      for (const s of shields) drawShieldPickup(s);
      for (const o of orbs) drawOrb(o);
      for (const e of enemies) drawEnemy(e);
      drawProjectiles();
      drawPortal();
      drawPlayer();
      drawParticles();
    }
  } else if (state !== STATE.TITLE) {
    // Still render world behind overlay
    updateParticles();
    if (platforms) {
      for (const p of platforms) drawPlatform(p);
      for (const l of lasers) drawLaser(l);
      for (const c of checkpoints) drawCheckpoint(c);
      for (const s of shields) drawShieldPickup(s);
      for (const o of orbs) drawOrb(o);
      for (const e of enemies) drawEnemy(e);
      drawProjectiles();
      drawPortal();
      drawPlayer();
      drawParticles();
    }
  }

  // Clear justPressed at end of frame
  for (const k in justPressed) delete justPressed[k];

  requestAnimationFrame(gameLoop);
}

// Initialize and start
loadLevel(0);
gameLoop();
</script>
